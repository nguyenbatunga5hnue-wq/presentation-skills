<script>
/* ---------- sound effects (synthesised, no files) ---------- */
window.SFX=(()=>{
  let ctx=null,on=true,timers=[];
  try{on=localStorage.getItem('c19t3:sfx')!=='0'}catch(e){}
  function C(){if(!ctx){const A=window.AudioContext||window.webkitAudioContext;if(!A)return null;ctx=new A()}if(ctx.state==='suspended')ctx.resume();return ctx}
  function tone(f,dur,{type='sine',vol=.18,at=0,to=null,attack=.005}={}){if(!on)return;const c=C();if(!c)return;const t=c.currentTime+at;
    const o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(to)o.frequency.exponentialRampToValueAtTime(to,t+dur);
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+attack);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g).connect(c.destination);o.start(t);o.stop(t+dur+.05)}
  function noise(dur,{vol=.15,at=0,f=1200,to=null,type='bandpass',q=1}={}){if(!on)return;const c=C();if(!c)return;const t=c.currentTime+at;
    const n=Math.floor(c.sampleRate*dur),buf=c.createBuffer(1,n,c.sampleRate),d=buf.getChannelData(0);for(let i=0;i<n;i++)d[i]=Math.random()*2-1;
    const s=c.createBufferSource();s.buffer=buf;const fl=c.createBiquadFilter();fl.type=type;fl.Q.value=q;fl.frequency.setValueAtTime(f,t);if(to)fl.frequency.exponentialRampToValueAtTime(to,t+dur);
    const g=c.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+dur*.2);g.gain.exponentialRampToValueAtTime(.0001,t+dur);s.connect(fl).connect(g).connect(c.destination);s.start(t)}
  const S={
    pop:(k=1)=>{const f=420*Math.pow(1.12,k-1);tone(f,.12,{to:f*1.9,vol:.2})},
    ding:()=>{tone(1318,.6,{vol:.12});tone(1976,.5,{vol:.07,at:.02})},
    chime:()=>{[660,880,1320].forEach((f,i)=>tone(f,.35,{vol:.1,at:i*.07}))},
    whoosh:(up=true)=>noise(.45,{vol:.12,f:up?400:2200,to:up?2400:350,q:.8}),
    thud:()=>{tone(150,.25,{to:60,vol:.35,type:'sine'});noise(.08,{vol:.08,f:300,type:'lowpass'})},
    tick:()=>noise(.03,{vol:.1,f:3500,type:'highpass'}),
    zip:()=>tone(300,.22,{type:'sawtooth',to:1400,vol:.05}),
    pour:()=>{noise(.7,{vol:.14,f:900,to:500,type:'lowpass'});noise(.5,{vol:.06,f:2500,at:.15,q:3})},
    splash:()=>{noise(.6,{vol:.2,f:1600,to:300,type:'lowpass'});tone(220,.2,{to:110,vol:.12,at:.05})},
    grow:()=>tone(260,.6,{to:900,vol:.12,type:'triangle'}),
    buzz:()=>tone(140,.28,{type:'square',vol:.06}),
    cheer:()=>{[523,659,784,1047].forEach((f,i)=>tone(f,.25,{vol:.12,at:i*.06,type:'triangle'}))},
    minus:()=>tone(330,.25,{to:200,vol:.12,type:'triangle'}),
  };
  const SC={
    1:[[.3,'whoosh'],[.4,'pop',1],[.9,'pop',3],[1.5,'pop',5],[2.5,'pop',2],[2.7,'tick'],[2.9,'tick'],[3.1,'pop',2],[3.3,'tick'],[3.5,'tick']],
    2:[[.9,'whoosh'],[2.2,'pop',2],[3.4,'whoosh'],[4.3,'zip'],[4.8,'ding']],
    3:[[.3,'whoosh'],[.5,'tick'],[.7,'tick'],[.9,'tick'],[1.1,'tick'],[1.3,'tick'],[2.4,'whoosh'],[2.6,'tick'],[2.8,'tick'],[3.0,'tick'],[3.2,'tick'],[3.8,'ding']],
    4:[[.3,'pop',1],[.8,'pop',2],[1.3,'pop',3],[1.8,'pop',4],[2.4,'whoosh',false],[3.6,'whoosh'],[3.9,'pop',3],[4.1,'pop',4],[4.3,'pop',5],[4.5,'pop',6],[5,'pop',1],[5.8,'zip'],[6.3,'ding']],
    5:[[.4,'whoosh']].concat([.7,2.1,3.5].flatMap(s=>Array.from({length:9},(_,i)=>[s+i*.14,'tick']))).concat([[5,'ding']])
  };
  function play(name,arg){if(S[name])S[name](arg)}
  return Object.assign(S,{
    play,
    scene(n){timers.forEach(clearTimeout);timers=[];(SC[n]||[]).forEach(([t,nm,a])=>timers.push(setTimeout(()=>play(nm,a),t*1000)))},
    stop(){timers.forEach(clearTimeout);timers=[]},
    get on(){return on},
    toggle(){on=!on;try{localStorage.setItem('c19t3:sfx',on?'1':'0')}catch(e){}if(!on)this.stop();return on}
  });
})();

/* ---------- group scoreboard ---------- */
(function(){
  const COLORS=['var(--t5)','var(--t2)','var(--green)','var(--t4)','var(--t3)','var(--t1)','#2B8A9E','#7A8699'];
  let st={groups:[1,2,3,4].map(i=>({name:'Nhóm '+i,score:0}))};
  try{const v=JSON.parse(localStorage.getItem('c19t3:score'));if(v&&v.groups&&v.groups.length)st=v}catch(e){}
  const save=()=>{try{localStorage.setItem('c19t3:score',JSON.stringify(st))}catch(e){}};
  const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  function lead(){const m=Math.max(...st.groups.map(g=>g.score));return m>0?m:null}
  function render(bump){
    const board=document.getElementById('board'),mini=document.getElementById('mini');
    const max=Math.max(5,...st.groups.map(g=>g.score)),L=lead();
    if(board){board.style.setProperty('--n',st.groups.length);
      board.innerHTML=st.groups.map((g,i)=>`<div class="team">${L!==null&&g.score===L?'<span class="crown">Dẫn đầu</span>':''}
        <div class="col-bar"><input class="score sc-in${bump===i?' bump':''}" type="number" min="0" inputmode="numeric" value="${g.score}" data-gi="${i}" id="sc-score-${i}" aria-label="Điểm ${esc(g.name)}"><div class="fillbar" style="height:${g.score/max*100}%;background:${COLORS[i%8]}"></div></div>
        <input class="nm nm-in" type="text" maxlength="24" value="${esc(g.name)}" placeholder="Nhập tên nhóm" data-gi="${i}" id="sc-name-${i}" aria-label="Tên nhóm ${i+1}">
        <div class="btns"><button data-sc="-1" data-gi="${i}" aria-label="Trừ 1 điểm">−1</button><button class="plus" data-sc="1" data-gi="${i}" aria-label="Cộng 1 điểm">+1</button><button class="plus" data-sc="2" data-gi="${i}" aria-label="Cộng 2 điểm">+2</button></div></div>`).join('')}
    if(mini){mini.innerHTML=st.groups.map((g,i)=>`<div class="r${L!==null&&g.score===L?' lead':''}"><i style="background:${COLORS[i%8]}"></i><span>${esc(g.name)}</span><b class="${bump===i?'bump':''}">${g.score}</b><button data-sc="-1" data-gi="${i}" aria-label="Trừ 1 điểm ${esc(g.name)}">−</button><button class="plus" data-sc="1" data-gi="${i}" aria-label="Cộng 1 điểm ${esc(g.name)}">+</button></div>`).join('')}
  }
  document.addEventListener('click',e=>{
    const b=e.target.closest('[data-sc]');
    if(b){const i=+b.dataset.gi,d=+b.dataset.sc;st.groups[i].score=Math.max(0,st.groups[i].score+d);save();render(i);d>0?SFX.cheer():SFX.minus();return}
    const a=e.target.closest('[data-act^="sc-"]');if(!a)return;
    const act=a.dataset.act;
    if(act==='sc-add'&&st.groups.length<8){st.groups.push({name:'Nhóm '+(st.groups.length+1),score:0});SFX.pop(2)}
    else if(act==='sc-del'&&st.groups.length>2){st.groups.pop();SFX.minus()}
    else if(act==='sc-reset'){if(a.dataset.sure){st.groups.forEach(g=>g.score=0);delete a.dataset.sure;a.textContent='Về 0';SFX.whoosh(false)}else{a.dataset.sure='1';a.textContent='Bấm lần nữa để đưa về 0';return}}
    else if(act==='sc-mini'){const m=document.getElementById('mini');m.hidden=!m.hidden;a.classList.toggle('on',!m.hidden)}
    else if(act==='sc-sfx'){const on=SFX.toggle();a.textContent=on?'Âm thanh: bật':'Âm thanh: tắt';a.classList.toggle('on',on)}
    save();render();
  });
  document.addEventListener('input',e=>{
    const n=e.target.closest('.nm-in');
    if(n){const i=+n.dataset.gi;st.groups[i].name=n.value.trim().slice(0,24)||('Nhóm '+(i+1));save();
      const mini=document.getElementById('mini');const r=mini&&mini.children[i];if(r)r.children[1].textContent=st.groups[i].name;return}
    const s=e.target.closest('.sc-in');
    if(s){const i=+s.dataset.gi,v=Math.max(0,Math.min(999,parseInt(s.value,10)||0));st.groups[i].score=v;save();
      const max=Math.max(5,...st.groups.map(g=>g.score));document.querySelectorAll('#board .fillbar').forEach((f,k)=>f.style.height=(st.groups[k].score/max*100)+'%')}
  });
  document.addEventListener('keydown',e=>{if(e.target.closest('.nm-in,.sc-in')&&e.key==='Enter'){e.preventDefault();e.target.blur()}},true);
  document.addEventListener('focusout',e=>{if(e.target.closest('.nm-in,.sc-in'))setTimeout(()=>{if(!document.activeElement||!document.activeElement.closest('#board'))render()},0)});
  /* jump to the scoreboard from anywhere, and back */
  let ret=null;
  function goScore(){const D=window.DECK;if(!D)return;const idx=D.indexOf('sScore');if(D.cur()===idx){if(ret!=null)D.show(ret);ret=null;return}
    ret=D.cur();D.show(idx);SFX.whoosh();paintBack()}
  function paintBack(){const b=document.getElementById('scBack');if(!b)return;const D=window.DECK;
    if(ret!=null&&D){b.hidden=false;b.textContent='↩ Quay lại slide '+(ret+1)}else b.hidden=true}
  document.addEventListener('click',e=>{
    if(e.target.closest('[data-act="sc-goto"]'))goScore();
    else if(e.target.closest('#scBack')){const D=window.DECK;if(D&&ret!=null){D.show(ret);SFX.whoosh(false)}ret=null;paintBack()}
  });
  document.addEventListener('keydown',e=>{if(e.target.closest('input,textarea,select,[contenteditable]'))return;if((e.key==='b'||e.key==='B')&&!e.ctrlKey&&!e.metaKey){goScore();e.preventDefault()}});
  window.addEventListener('deck:show',()=>{const D=window.DECK;if(D&&D.cur()!==D.indexOf('sScore')){ret=null}paintBack()});
  window.addEventListener('DOMContentLoaded',()=>render());
  render();
})();
</script>

<script>
(function(){
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const slides=$$('.slide'), audio=$('#audio');
const fmt=t=>{t=Math.max(0,Math.floor(t));return Math.floor(t/60)+':'+String(t%60).padStart(2,'0')};
const store={get(k,d){try{const v=localStorage.getItem('c19t3:'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},
             set(k,v){try{localStorage.setItem('c19t3:'+k,JSON.stringify(v))}catch(e){}}};
let cur=0, stopAt=null, clipOwner=null, clipFrom=0;

/* ---------- timestamps on subtitle lines ---------- */
$$('.ln[data-t]').forEach(l=>{const tm=document.createElement('span');tm.className='tm';tm.textContent=fmt(+l.dataset.t);l.prepend(tm);l.tabIndex=0;l.setAttribute('role','button');l.setAttribute('aria-label','Nghe từ '+fmt(+l.dataset.t))});

/* ---------- navigation with build steps ---------- */
const jump=$('#jump');
slides.forEach((s,i)=>{const o=document.createElement('option');o.value=i;o.textContent=(i+1)+'. '+(s.dataset.title||'');jump.appendChild(o)});
jump.onchange=()=>show(+jump.value);
const STEP={};
function show(i){
  cur=Math.max(0,Math.min(slides.length-1,i));
  slides.forEach((s,k)=>s.classList.toggle('on',k===cur));
  $('#count').textContent=(cur+1)+' / '+slides.length; jump.value=cur;
  SFX.stop();const s=slides[cur]; if(s.id&&ENTER[s.id])ENTER[s.id](s);
  try{history.replaceState(null,'','#s'+(cur+1))}catch(e){}
  window.dispatchEvent(new Event('deck:show'));
}
window.DECK={show:i=>show(i),cur:()=>cur,indexOf:id=>slides.findIndex(s=>s.id===id)};
function stepOf(s){return +(s.dataset.step||0)}
function next(){const s=slides[cur],max=+(s.dataset.steps||0);
  if(max&&stepOf(s)<max){s.dataset.step=stepOf(s)+1;STEP[s.id]&&STEP[s.id](s,stepOf(s));return}
  show(cur+1)}
function prev(){const s=slides[cur],max=+(s.dataset.steps||0);
  if(max&&stepOf(s)>0){s.dataset.step=stepOf(s)-1;STEP[s.id]&&STEP[s.id](s,stepOf(s));return}
  show(cur-1)}
$('#prev').onclick=prev; $('#next').onclick=next;
$('#fs').onclick=()=>{const el=document.documentElement;
  if(document.fullscreenElement){document.exitFullscreen&&document.exitFullscreen().catch(()=>{})}
  else if(el.requestFullscreen){el.requestFullscreen().catch(()=>{})}};

/* ---------- audio transport ---------- */
const seek=$('#seek'), tPlay=$('#tPlay'), clipmark=$('#clipmark'), nowclip=$('#nowclip');
const speeds=[1,0.9,0.8,1.15];let si=0;
function setPlayLabel(){tPlay.textContent=audio.paused?'▶ Phát':'❚❚ Dừng';tPlay.classList.toggle('on',!audio.paused)}
function play(){const p=audio.play();if(p&&p.catch)p.catch(()=>{})}
function clearClip(){stopAt=null;clipOwner&&clipOwner.classList.remove('live');clipOwner=null;clipmark.hidden=true;nowclip.textContent='';
  $$('.playing').forEach(l=>l.classList.remove('playing'))}
function playClip(from,to,owner,label){
  clearClip();audio.currentTime=from;stopAt=to;clipFrom=from;clipOwner=owner||null;
  if(clipOwner)clipOwner.classList.add('live');
  const d=audio.duration||+seek.max;clipmark.style.left=(from/d*100)+'%';clipmark.style.width=((to-from)/d*100)+'%';clipmark.hidden=false;
  nowclip.textContent=label||'';play();
}
tPlay.onclick=()=>{if(audio.paused)play();else audio.pause()};
$('#tBack').onclick=()=>{audio.currentTime=Math.max(0,audio.currentTime-5)};
$('#tFwd').onclick=()=>{audio.currentTime=audio.currentTime+5};
$('#tStop').onclick=()=>{audio.pause();clearClip()};
$('#tSpd').onclick=e=>{si=(si+1)%speeds.length;audio.playbackRate=speeds[si];e.target.textContent=speeds[si]+'×'};
seek.oninput=()=>{audio.currentTime=+seek.value};
audio.addEventListener('loadedmetadata',()=>{seek.max=audio.duration});
audio.addEventListener('play',setPlayLabel);
audio.addEventListener('pause',()=>{setPlayLabel();$$('.playing').forEach(l=>l.classList.remove('playing'))});
audio.addEventListener('timeupdate',()=>{
  const t=audio.currentTime;
  if(document.activeElement!==seek)seek.value=t;
  $('#tnow').textContent=fmt(t)+' / '+fmt(audio.duration||+seek.max);
  if(stopAt!=null&&t>=stopAt){audio.pause();audio.currentTime=stopAt;clearClip();return}
  if(audio.paused)return;
  // subtitle sync on the visible slide
  $$('.subs, .gf',slides[cur]).forEach(box=>{
    if(!box.offsetParent)return;
    const ls=$$('.ln[data-t]',box);let act=null;
    const end=+(box.dataset.end||1e9);
    if(t<=end+0.3)ls.forEach(l=>{if(+l.dataset.t<=t+0.05)act=l});
    ls.forEach(l=>l.classList.toggle('playing',l===act));
    if(act){const r=act.offsetTop-box.offsetTop;if(r<box.scrollTop||r>box.scrollTop+box.clientHeight-30)box.scrollTop=Math.max(0,r-20)}
  });
  // auto numbering of MCQ options
  const mq=$('.mq.on.auto',slides[cur]);
  if(mq&&clipOwner===mq)$$('.opt[data-t]',mq).forEach(o=>{if(!o.classList.contains('said')&&+o.dataset.t<=t)sayOpt(o)});
});

/* ---------- error counters + notes (kept in this browser) ---------- */
function errKey(el){return 'err:'+el.dataset.id}
function paintErr(el){const n=store.get(errKey(el),0);const c=$('.errc',el);if(c){$('.num',c).textContent=n;c.classList.toggle('has',n>0)}
  const tab=$('.tabs button[data-for="'+el.id+'"] .e');if(tab){tab.textContent=n;tab.classList.toggle('has',n>0)}}
$$('[data-id]').forEach(el=>{paintErr(el);const ta=$('.notein',el);if(ta){ta.value=store.get('note:'+el.dataset.id,'');
  ta.addEventListener('input',()=>store.set('note:'+el.dataset.id,ta.value))}});

/* ---------- MCQ helpers ---------- */
function sayOpt(o){if(!o.classList.contains('said'))SFX.pop(+o.dataset.ord||1);o.classList.add('said')}
function orderStep(mq){const os=$$('.opt',mq).filter(o=>+o.dataset.ord>0&&!o.classList.contains('said')).sort((a,b)=>a.dataset.ord-b.dataset.ord);
  if(os.length){sayOpt(os[0]);return}
  $$('.opt.none',mq).forEach(sayOpt)}

/* ---------- click handling ---------- */
document.addEventListener('click',e=>{
  const ln=e.target.closest('.ln[data-t]');
  if(ln&&!e.target.closest('input')){const box=ln.closest('[data-end]');const own=ln.closest('.qrow,.mq');
    playClip(+ln.dataset.t,box?+box.dataset.end:+ln.dataset.t+30,own,'Từ '+fmt(+ln.dataset.t));return}
  const b=e.target.closest('[data-act]');if(!b)return;
  const s=b.closest('.slide'),act=b.dataset.act,row=b.closest('.qrow,.mq');
  switch(act){
    case 'step': next();break;
    case 'clip': playClip(+b.dataset.from,+b.dataset.to,row||null,b.dataset.label||'');break;
    case 'cc': row.classList.toggle('cc-on');b.classList.toggle('on');SFX.tick();break;
    case 'clue': row.classList.toggle('clue-on');b.classList.toggle('on');if(row.classList.contains('clue-on'))SFX.chime();break;
    case 'ans': row.classList.toggle('ans-on');if(row.classList.contains('ans-on'))SFX.ding();$$('[data-act="ans"].b',row).forEach(x=>x.classList.toggle('on',row.classList.contains('ans-on')));break;
    case 'note': row.classList.toggle('note-on');b.classList.toggle('on');if(row.classList.contains('note-on')){const ta=$('.notein',row);ta&&ta.focus()}break;
    case 'err+': case 'err-':{const el=b.closest('[data-id]');const n=Math.max(0,store.get(errKey(el),0)+(act==='err+'?1:-1));store.set(errKey(el),n);paintErr(el);act==='err+'?SFX.buzz():SFX.tick();break}
    case 'all-ans':{const on=!s.classList.contains('all-on');s.classList.toggle('all-on',on);$$('.qrow',s).forEach(r=>{r.classList.toggle('ans-on',on);$$('[data-act="ans"].b',r).forEach(x=>x.classList.toggle('on',on))});b.classList.toggle('on',on);if(on)SFX.ding();break}
    case 'tab':{$$('.tabs button',s).forEach(x=>x.classList.toggle('on',x===b));$$('.mq',s).forEach(m=>m.classList.toggle('on',m.id===b.dataset.for));SFX.whoosh();break}
    case 'ord': orderStep(row);break;
    case 'ord-auto': row.classList.toggle('auto');b.classList.toggle('on');break;
    case 'ord-reset': $$('.opt',row).forEach(o=>o.classList.remove('said'));break;
    case 'reveal': s.classList.toggle('revealed');b.classList.toggle('on');if(s.classList.contains('revealed'))SFX.ding();break;
    case 'round2': s.classList.remove('hideScript');SFX.whoosh();break;
    case 'round1': s.classList.add('hideScript');break;
    case 'check': $$('.gf input',s).forEach(inp=>{const ok=inp.dataset.a.split('|').some(a=>a.toLowerCase()===inp.value.trim().toLowerCase());inp.classList.toggle('right',ok);inp.classList.toggle('wrong',!ok&&inp.value.trim()!=='')});$$('.gf input.wrong',s).length?SFX.buzz():SFX.ding();break;
    case 'fill': $$('.gf input',s).forEach(inp=>{inp.value=inp.dataset.a.split('|')[0];inp.classList.add('right');inp.classList.remove('wrong')});SFX.chime();break;
    case 'pyr-replay': renderScene(+($('#sPyr').dataset.sel||stepOf($('#sPyr'))||1));break;
    case 'bk-pour': bkPour();break;
    case 'bk-grow': bkGrow();break;
    case 'bk-reset': bkReset();break;
    case 'err-clear': if(b.dataset.sure){$$('[data-id]').forEach(el=>{store.set(errKey(el),0);paintErr(el)});delete b.dataset.sure;b.textContent='Xoá số đếm';renderErrSum()}else{b.dataset.sure='1';b.textContent='Bấm lần nữa để xoá'}break;
  }
});
document.addEventListener('keydown',e=>{
  if(e.target.closest('input,textarea,select,[contenteditable]'))return;
  if(e.key==='ArrowRight'||e.key==='PageDown'){next();e.preventDefault()}
  else if(e.key==='ArrowLeft'||e.key==='PageUp'){prev();e.preventDefault()}
  else if(e.key===' '&&!e.target.closest('button')){if(audio.paused)play();else audio.pause();e.preventDefault()}
  else if(e.key==='Escape'){audio.pause();clearClip()}
  else if(e.key==='Enter'&&e.target.classList.contains('ln')){e.target.click()}
});

const G=372,CX=260;let C=3,W=0,LOST=0;
function bkDraw(){const h=52*C,top=G-h;
  const p=`M${CX-150} ${top} L${CX-118} ${G} L${CX+118} ${G} L${CX+150} ${top}`;
  $('#bkBody').setAttribute('d',p);$('#bkClipPath').setAttribute('d',p+' Z');
  const wh=h*Math.min(W,C)/C;const r=$('#bkWater');r.setAttribute('y',G-wh);r.setAttribute('height',wh);
  $('#bkStream').setAttribute('d',`M330 ${Math.max(10,top-150)} C 320 ${top-100}, 300 ${top-60}, 290 ${top+10}`);
  $('#bkCap').textContent=C;$('#bkW').textContent=Math.min(W,C);$('#bkLost').textContent=LOST}
function msg(t){const m=$('#bkMsg');m.textContent=t;m.classList.remove('fadein');void m.offsetWidth;m.classList.add('fadein')}
function bkPour(){SFX.pour();const st=$('#bkStream');
  st.animate([{strokeDashoffset:200,opacity:1},{strokeDashoffset:0,opacity:1},{strokeDashoffset:-200,opacity:0}],{duration:900,easing:'ease-in'});
  setTimeout(()=>{
    if(W>=C){LOST++;bkOverflow();msg(LOST>=2?'Thùng đầy rồi. Luyện thêm bao nhiêu đề nước cũng tràn ra ngoài: điểm không lên.':'Tràn! Thùng chỉ chứa được '+C+' gáo.')}
    else{W++;msg(W>=C?'Đầy thùng. Muốn chứa thêm, phải làm thùng to ra.':'Luyện đề giúp đổ đầy thùng. Còn chỗ cho '+(C-W)+' gáo nữa.')}
    bkDraw()},550)}
function bkOverflow(){SFX.splash();const h=52*C,top=G-h,g=$('#bkDrips');
  [[-1,CX-150],[1,CX+150]].forEach(([s,x])=>{const p=document.createElementNS('http://www.w3.org/2000/svg','path');
    p.setAttribute('d',`M${x} ${top} C ${x+s*18} ${top+10}, ${x+s*24} ${top+h*.5}, ${x+s*30} ${G}`);p.setAttribute('fill','none');p.setAttribute('stroke','#3E6FD8');p.setAttribute('stroke-width','7');p.setAttribute('stroke-linecap','round');p.setAttribute('stroke-dasharray','400');g.appendChild(p);
    p.animate([{strokeDashoffset:400,opacity:1},{strokeDashoffset:0,opacity:1},{strokeDashoffset:0,opacity:0}],{duration:1400,easing:'ease-in',fill:'forwards'});
    const e=document.createElementNS('http://www.w3.org/2000/svg','ellipse');e.setAttribute('cx',x+s*34);e.setAttribute('cy',G+4);e.setAttribute('rx',10+LOST*6);e.setAttribute('ry',4+LOST);e.setAttribute('fill','#3E6FD8');e.setAttribute('opacity','.3');g.appendChild(e);
    setTimeout(()=>p.remove(),1500)})}
function bkGrow(){SFX.grow();if(C>=6){msg('Thùng đã rất lớn. Giờ luyện đề sẽ thấy điểm lên rõ.');return}C++;bkDraw();msg('Nghe nguồn thật làm thùng to ra: giờ chứa được '+C+' gáo. Luyện đề tiếp sẽ không bị tràn.')}
function bkReset(){C=3;W=0;LOST=0;$('#bkDrips').innerHTML='';bkDraw();msg('Thùng nhỏ chỉ chứa được 3 gáo. Thử múc liên tục xem chuyện gì xảy ra.')}

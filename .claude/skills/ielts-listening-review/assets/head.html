<title>{{TITLE}}</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&family=Lora:ital,wght@0,500;0,600;0,700;1,500&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: teacher console. Top = full-test audio transport; middle = one 16:9 slide scaled to the window; bottom = slide navigation. Single light "whiteboard" look for projection. */
:root{
  color-scheme: light;
  --paper:#F4F6F8; --card:#FFFFFF; --ink:#16213A; --ink-2:#4A5670; --line:#D9DFE7;
  --blue:#1F5FD6; --blue-soft:#E3ECFC; --orange:#C25E0C; --orange-soft:#FCEBDD;
  --green:#18794E; --green-soft:#E1F3EA; --red:#B42318; --red-soft:#FDE7E5; --purple:#5B3EA6; --purple-soft:#EFE8FA;
  --night:#101A30; --night-ink:#E8EDF7; --yellow:#FFF3C9;
  --t1:#F2B84B; --t2:#E9925A; --t3:#D46A6A; --t4:#8E6CC8; --t5:#3E6FD8;
  --f-body:'Be Vietnam Pro', Arial, sans-serif; --f-head:'Lora', Georgia, serif; --f-mono:'JetBrains Mono', 'Courier New', monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);margin:0;display:flex;flex-direction:column;gap:8px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:10px}
button{font-family:inherit}

/* ---------- top transport ---------- */
#top{display:flex;align-items:center;gap:10px;background:var(--night);color:var(--night-ink);border-radius:12px;padding:8px 12px;flex-wrap:wrap}
#top .lbl{font:700 11px var(--f-body);letter-spacing:.12em;text-transform:uppercase;color:#8FB2F5;white-space:nowrap}
#top button{font:700 13px var(--f-body);background:#22305A;color:#fff;border:1px solid #33467A;border-radius:7px;padding:6px 10px;cursor:pointer;white-space:nowrap}
#top button:hover{background:#2C3D70}
#top button.on{background:var(--blue);border-color:var(--blue)}
#top button:focus-visible{outline:3px solid #8FB2F5;outline-offset:2px}
#seekwrap{flex:1;min-width:160px;position:relative;height:26px;display:flex;align-items:center}
#seek{width:100%;accent-color:#8FB2F5}
#clipmark{position:absolute;top:3px;height:4px;background:#F2B84B;border-radius:2px;pointer-events:none}
#tnow{font:500 13px var(--f-mono);min-width:96px;text-align:center;font-variant-numeric:tabular-nums}
#nowclip{font:600 12px var(--f-body);color:#F2B84B;min-width:90px}

#viewport{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
#stage{position:relative;width:min(100%, calc((100vh - 140px) * 16 / 9));aspect-ratio:16/9;max-width:100%;container-type:inline-size}
.slide{position:absolute;inset:0;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 10px 30px rgba(22,33,58,.08);
  padding:2.8cqi 3.6cqi;display:none;flex-direction:column;gap:1.3cqi;overflow:hidden;font-size:1.45cqi;line-height:1.45}
.slide.on{display:flex}
.slide.dark{background:var(--night);color:var(--night-ink);border-color:var(--night)}
.eyebrow{font-size:1.05cqi;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--blue)}
.dark .eyebrow{color:#8FB2F5}
h1,h2,h3{font-family:var(--f-head);margin:0;text-wrap:balance;font-weight:600}
h1{font-size:5cqi;line-height:1.05}
h2{font-size:2.6cqi;line-height:1.12}
h3{font-size:1.7cqi;line-height:1.2}
p{margin:0}
.sub{color:var(--ink-2)}
.dark .sub{color:#B7C3DA}
.row{display:flex;gap:2cqi;min-height:0}
.col{display:flex;flex-direction:column;gap:1cqi;min-width:0;min-height:0}
.grow{flex:1}
.pill{display:inline-block;padding:.2cqi .8cqi;border-radius:99px;font-size:1.05cqi;font-weight:700;letter-spacing:.04em}
.hdr{display:flex;align-items:flex-end;justify-content:space-between;gap:2cqi}
.tools{display:flex;gap:.6cqi;flex-wrap:wrap;justify-content:flex-end}
button.b{font-size:1.05cqi;font-weight:700;border-radius:8px;padding:.45cqi .9cqi;border:1.5px solid var(--ink);background:var(--card);color:var(--ink);cursor:pointer;white-space:nowrap;line-height:1.3}
button.b:hover{background:var(--paper)}
button.b.pri{background:var(--ink);color:#fff}
button.b.pri:hover{background:#26345a}
button.b.on{background:var(--blue);border-color:var(--blue);color:#fff}
button.b.sm{font-size:.95cqi;padding:.3cqi .65cqi;border-width:1px;border-color:var(--line)}
button.b.sm.on{border-color:var(--blue)}
button:focus-visible,.ln:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.hint{font-size:1cqi;color:var(--ink-2)}

/* ---------- pyramid build ---------- */
.pbuild{display:grid;grid-template-columns:40% 1fr;gap:2.4cqi;flex:1;min-height:0}
.pyr{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:.5cqi}
.tier{border:0;cursor:pointer;color:#fff;font-weight:700;font-size:1.3cqi;padding:1cqi 0;clip-path:polygon(6% 0,94% 0,100% 100%,0 100%);text-align:center;line-height:1.2;
  opacity:0;transform:translateY(3cqi) scale(.9);transition:opacity .5s, transform .6s cubic-bezier(.2,1.4,.4,1), filter .2s}
.tier.top{clip-path:polygon(50% 0,100% 100%,0 100%);padding-top:2.3cqi}
.tier small{display:block;font-weight:500;font-size:.95cqi;opacity:.92}
.tier.in{opacity:1;transform:none}
.tier.dim{filter:saturate(.35) brightness(1.15)}
.tier.sel{filter:drop-shadow(0 .5cqi .8cqi rgba(22,33,58,.35)) brightness(1.06)}
.scene{position:relative;background:var(--paper);border-radius:14px;padding:1.8cqi 2cqi;overflow:hidden;display:flex;flex-direction:column;gap:1.1cqi}
.scene .age{font-size:1.05cqi;font-weight:800;letter-spacing:.12em;text-transform:uppercase}
.scene h3{font-size:2.2cqi}
.stagebox{flex:1;min-height:0;position:relative;background:var(--card);border-radius:10px;border:1px solid var(--line);display:flex;flex-direction:column;justify-content:space-evenly;gap:1cqi;padding:1.2cqi 1.4cqi;overflow:hidden}
.timeline{position:relative;display:flex;justify-content:space-between;padding-top:1cqi}
.timeline .track{position:absolute;left:4%;right:4%;top:2.2cqi;height:.45cqi;background:var(--line);border-radius:9px}
.timeline .fill{position:absolute;left:4%;top:2.2cqi;height:.45cqi;background:var(--ink);border-radius:9px;width:0;transition:width .8s ease}
.timeline .node{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:.4cqi;width:16%;font-size:1cqi;font-weight:700;color:var(--ink-2);text-align:center}
.timeline .dot{width:2.6cqi;height:2.6cqi;border-radius:50%;background:var(--card);border:.3cqi solid var(--line);transition:all .5s;display:flex;align-items:center;justify-content:center;font-size:1.1cqi;color:#fff}
.timeline .node.on .dot{border-color:transparent;transform:scale(1.15)}
.timeline .node.on{color:var(--ink)}

/* scene pieces */
@keyframes pop{0%{opacity:0;transform:scale(.4)}70%{opacity:1;transform:scale(1.12)}100%{opacity:1;transform:scale(1)}}
@keyframes rise{from{opacity:0;transform:translateY(1.5cqi)}to{opacity:1;transform:none}}
@keyframes fly{from{opacity:0;transform:translate(var(--dx),var(--dy)) rotate(var(--r))}to{opacity:1;transform:none}}
@keyframes travel{0%{opacity:0;transform:translateX(0) scale(.6)}20%{opacity:1;transform:translateX(0) scale(1)}100%{opacity:1;transform:translateX(var(--to)) scale(1)}}
@keyframes ring{0%{transform:scale(.6);opacity:.8}100%{transform:scale(2.2);opacity:0}}
@keyframes split{from{gap:0}to{gap:1.1cqi}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes bar{from{height:0}}
@keyframes strike{from{width:0}to{width:100%}}
@keyframes blur{0%{filter:none;opacity:1}100%{filter:blur(.5cqi);opacity:.25}}
@keyframes unblur{from{filter:blur(.5cqi);opacity:.25}to{filter:none;opacity:1}}
@keyframes type{from{width:0}to{width:100%}}
@keyframes eq{0%,100%{transform:scaleY(.3)}50%{transform:scaleY(1)}}
.a{opacity:0;animation-fill-mode:both;animation-duration:.6s;animation-timing-function:cubic-bezier(.2,1.2,.4,1)}
.pop{animation-name:pop}.rise{animation-name:rise}
.lbl2{font-size:1cqi;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2)}
.avatar{width:6cqi;height:6cqi;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:1.2cqi;color:#fff;flex:none;position:relative}
.bubble{position:absolute;left:7cqi;top:50%;margin-top:-1.7cqi;background:var(--card);border:2px solid var(--ink);border-radius:1.6cqi;padding:.4cqi 1.1cqi;font-weight:800;font-size:1.6cqi;opacity:0;animation:travel 1.4s cubic-bezier(.3,.7,.3,1) both}
.ringfx{position:absolute;inset:0;border-radius:50%;border:.25cqi solid var(--t1);animation:ring 1.6s ease-out infinite}
.stress{display:flex;gap:1.4cqi}
.stress .w{background:var(--paper);border-radius:8px;padding:.8cqi 1.2cqi;display:flex;flex-direction:column;gap:.5cqi;align-items:center}
.stress .bars{display:flex;gap:.4cqi;align-items:flex-end;height:4cqi}
.stress .bars i{display:block;width:3.2cqi;border-radius:4px 4px 0 0;animation:bar .8s cubic-bezier(.2,1.4,.4,1) both}
.stress .syl{display:flex;gap:.4cqi;font-weight:700;font-size:1.2cqi}
.stress .syl span{width:3.2cqi;text-align:center}
.stream{display:flex;gap:0;font-size:2.6cqi;font-weight:800;font-family:var(--f-head);animation:split .9s ease both}
.chunk{position:relative;display:inline-flex;flex-direction:column;align-items:flex-start;gap:.4cqi}
.chunk .ul{height:.45cqi;width:100%;border-radius:9px;transform-origin:left;transform:scaleX(0);animation:grow .7s ease both}
.flyw{display:flex;flex-wrap:wrap;gap:.7cqi;font-family:var(--f-head);font-weight:700;font-size:2.4cqi}
.flyw span{opacity:0;animation:fly .7s cubic-bezier(.2,1.1,.4,1) both}
.card{background:var(--paper);border-radius:10px;padding:.8cqi 1.2cqi}
.memo{display:flex;flex-direction:column;gap:.4cqi;font-size:1.45cqi;font-weight:600}
.memo .it{display:flex;align-items:center;gap:.7cqi}
.memo .ck{width:1.7cqi;height:1.7cqi;border-radius:50%;background:var(--green);color:#fff;font-size:1cqi;display:flex;align-items:center;justify-content:center;opacity:0}
.chip{display:inline-block;position:relative;padding:.4cqi 1.1cqi;border-radius:99px;font-weight:800;font-size:1.6cqi}
.chip .st{position:absolute;left:5%;top:50%;height:.35cqi;background:var(--orange);border-radius:4px;width:0}
.eqz{display:flex;gap:.35cqi;align-items:center;height:5cqi}
.eqz i{display:block;width:.8cqi;height:100%;background:var(--t5);border-radius:4px;transform-origin:center;animation:eq .9s ease-in-out infinite}
.nb{background:#FFFDF6;border:1px solid #E6DFC8;border-radius:8px;padding:1cqi 1.3cqi;font-family:var(--f-mono);font-size:1.25cqi;display:flex;flex-direction:column;gap:.5cqi;
  background-image:repeating-linear-gradient(transparent 0 2.45cqi, #EDE6CF 2.45cqi 2.55cqi)}
.nb .ty{display:block;overflow:hidden;white-space:nowrap;width:0;animation:type 1.3s steps(30) both}
.arrowR{font-size:2.4cqi;font-weight:800;color:var(--ink-2)}

/* ---------- band meter ---------- */
.meter{display:grid;grid-template-columns:30% 12% 1fr;gap:2cqi;flex:1;min-height:0}
.mini .tier{opacity:1;transform:none;font-size:1.15cqi;padding:.85cqi 0}
.scale{position:relative;border-radius:12px;background:linear-gradient(to top,var(--t1),var(--t2) 25%,var(--t3) 45%,var(--t4) 65%,var(--t5) 85%)}
.scale .tick{position:absolute;left:0;right:0;border-top:1px dashed rgba(255,255,255,.7);font:700 1.05cqi var(--f-mono);color:#fff;padding-left:.5cqi}
.scale .mk{position:absolute;left:-1.2cqi;right:-1.2cqi;height:3.2cqi;transform:translateY(50%);transition:bottom .9s cubic-bezier(.2,1.3,.4,1);display:flex;align-items:center;justify-content:center}
.scale .mk span{background:var(--ink);color:#fff;font:700 1.35cqi var(--f-head);padding:.2cqi .8cqi;border-radius:8px;box-shadow:0 .4cqi 1cqi rgba(0,0,0,.25);white-space:nowrap}
.minfo{background:var(--paper);border-radius:14px;padding:1.8cqi;display:flex;flex-direction:column;gap:.9cqi}
.minfo .k{font-size:1cqi;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2)}
.minfo ul{margin:0;padding-left:1.3cqi}
.fadein{animation:rise .5s ease both}

.stuck{display:grid;grid-template-columns:repeat(3,1fr);gap:1.4cqi;align-items:start}
.stuck .c{background:var(--paper);border-radius:12px;padding:1.6cqi;display:flex;flex-direction:column;gap:.7cqi;opacity:.12;filter:grayscale(1);transition:opacity .5s, filter .5s, transform .5s;transform:translateY(1cqi)}
.stuck .c.in{opacity:1;filter:none;transform:none}
.stuck .big{font-family:var(--f-head);font-weight:700;font-size:2.8cqi;line-height:1.05}
.stuck ul{margin:0;padding-left:1.3cqi;display:flex;flex-direction:column;gap:.3cqi}

/* bucket */
.bucket{display:grid;grid-template-columns:1.1fr 1fr;gap:2.6cqi;flex:1;min-height:0;align-items:center}
.bucket svg{width:100%;height:100%;max-height:100%}
.stat{display:flex;gap:1.2cqi}
.stat div{flex:1;background:var(--paper);border-radius:10px;padding:.8cqi 1cqi}
.stat b{display:block;font:700 2.6cqi var(--f-head)}
.vs .c{border-radius:12px;padding:1.2cqi 1.4cqi;display:flex;flex-direction:column;gap:.4cqi}
#bkMsg{font-weight:700;font-size:1.5cqi;min-height:4.4cqi}

/* ---------- test: gap-fill rows ---------- */
.qlist{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:.7cqi;padding-right:.4cqi}
.qrow{background:var(--paper);border-radius:10px;padding:.8cqi 1.1cqi;border:1.5px solid transparent;transition:border-color .2s, background .2s}
.qrow.live{border-color:#F2B84B;background:#FFFBEF}
.qline{display:grid;grid-template-columns:3cqi 1fr auto;gap:1cqi;align-items:center}
.qn{width:2.8cqi;height:2.8cqi;border-radius:50%;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:1.25cqi}
.qtext{font-size:1.4cqi;line-height:1.5}
.qtext .grp{font-weight:700}
.gapbtn{display:inline-block;min-width:9cqi;border:0;border-bottom:2px dotted var(--ink-2);background:transparent;font-weight:800;font-size:1.4cqi;color:var(--ink-2);padding:0 .5cqi;cursor:pointer;border-radius:4px 4px 0 0;vertical-align:baseline}
.gapbtn .an{display:none}
.ans-on .gapbtn{background:var(--blue-soft);color:var(--blue);border-bottom:2px solid var(--blue);animation:pop .45s both}
.ans-on .gapbtn .an{display:inline}.ans-on .gapbtn .qm{display:none}
.qctl{display:flex;gap:.45cqi;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.errc{display:inline-flex;align-items:center;gap:.25cqi;font-size:.95cqi;font-weight:700;color:var(--red);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:.1cqi .3cqi}
.errc button{border:0;background:transparent;color:var(--red);font-weight:800;font-size:1.15cqi;cursor:pointer;padding:0 .35cqi}
.errc .num{min-width:1.6cqi;text-align:center;font-family:var(--f-mono)}
.errc.has{background:var(--red-soft);border-color:#F5B7B1}
.drawer{display:none;margin-top:.7cqi;margin-left:4cqi;flex-direction:column;gap:.6cqi}
.cc-on .drawer.ccd,.clue-on .drawer.clued,.note-on .drawer.noted{display:flex}
.drawer.clued .cluebox{background:var(--purple-soft);color:var(--purple);border-radius:8px;padding:.5cqi .9cqi;font-size:1.2cqi;animation:rise .35s both}
.trapnote{display:none;background:var(--orange-soft);color:var(--orange);border-radius:8px;padding:.5cqi .9cqi;font-size:1.15cqi;font-weight:600}
.ans-on .trapnote{display:block;animation:rise .35s both}
.subs{background:var(--night);color:var(--night-ink);border-radius:10px;padding:.7cqi .9cqi;display:flex;flex-direction:column;gap:.15cqi;animation:rise .3s both}
.ln{display:grid;grid-template-columns:3.6cqi 1.8cqi 1fr;gap:.6cqi;padding:.3cqi .5cqi;border-radius:6px;cursor:pointer;align-items:baseline;font-size:1.3cqi;opacity:.55;transition:opacity .2s, background .2s}
.ln:hover{opacity:.9}
.ln.playing{opacity:1;background:#26365F}
.subs.static .ln{opacity:.95}
.ln .tm{font-family:var(--f-mono);font-size:.9cqi;color:#8FA0C2}
.ln .sp{font-weight:800;font-size:1cqi;color:#F2B84B}
mark{background:none;color:inherit;padding:0 .12cqi;border-radius:3px}
.ans-on mark.k,.revealed mark.k{background:#2F6BE0;color:#fff;font-weight:700}
.ans-on mark.t,.revealed mark.t{background:transparent;color:#FFB27A;font-weight:700;text-decoration:underline wavy #FF8A3D;text-underline-offset:.3cqi}
.clue-on mark.p,.revealed mark.p{background:rgba(160,130,240,.28);color:#D9CCFF;font-weight:600}
.notein{width:100%;font:inherit;font-size:1.15cqi;border:1.5px dashed var(--red);background:var(--card);border-radius:8px;padding:.5cqi .8cqi;color:var(--ink);resize:vertical;min-height:3.4cqi}

/* ---------- MCQ ---------- */
.tabs{display:flex;gap:.5cqi;flex-wrap:wrap}
.tabs button{font-size:1.2cqi;font-weight:800;border-radius:9px;padding:.45cqi 1.2cqi;border:1.5px solid var(--line);background:var(--card);color:var(--ink-2);cursor:pointer}
.tabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.tabs button .e{display:none;margin-left:.4cqi;font-size:.9cqi;background:var(--red);color:#fff;border-radius:99px;padding:0 .45cqi}
.tabs button .e.has{display:inline-block}
.mq{display:none;flex:1;min-height:0;flex-direction:column;gap:1cqi}
.mq.on{display:flex}
.mqtop{display:grid;grid-template-columns:1fr auto;gap:1.6cqi;align-items:start}
.stem{font-family:var(--f-head);font-weight:600;font-size:2.05cqi;line-height:1.3}
.stem .clue{border-radius:4px;transition:background .3s, color .3s, box-shadow .3s}
.clue-on .stem .clue{background:var(--purple-soft);color:var(--purple);box-shadow:inset 0 -.25cqi 0 var(--purple)}
.cluenote{display:none;background:var(--purple-soft);color:var(--purple);border-radius:8px;padding:.5cqi .9cqi;font-size:1.2cqi;font-weight:600}
.clue-on .cluenote{display:block;animation:rise .35s both}
.mqbody{display:grid;grid-template-columns:1fr;gap:1cqi;flex:1;min-height:0;overflow:auto}
.cc-on .mqbody{grid-template-columns:1fr 1fr}
.opts{display:flex;flex-direction:column;gap:.6cqi}
.opt{position:relative;display:grid;grid-template-columns:2.8cqi 1fr 3.2cqi;gap:.9cqi;align-items:center;background:var(--paper);border-radius:10px;padding:.75cqi 1cqi;border:2px solid transparent;transition:border-color .3s, background .3s, opacity .3s}
.opt .L{font:700 1.8cqi var(--f-head);text-align:center}
.opt .tx{font-size:1.45cqi;font-weight:600;position:relative}
.opt .q{display:none;font-size:1.1cqi;font-weight:500;color:var(--ink-2);margin-top:.25cqi}
.opt .q i{font-style:normal;font-family:var(--f-mono);font-size:.9cqi;color:var(--ink-2);margin-left:.4cqi}
.opt.said .q{display:block;animation:rise .35s both}
.badge{width:3cqi;height:3cqi;border-radius:50%;background:var(--ink);color:#fff;font:800 1.5cqi var(--f-body);display:flex;align-items:center;justify-content:center;opacity:0;transform:scale(.3)}
.opt.said .badge{animation:pop .5s cubic-bezier(.2,1.6,.4,1) both}
.opt.said{border-color:var(--ink)}
.opt.none .badge{background:var(--line);color:var(--ink-2);font-size:1cqi}
.opt.none.said{border-color:var(--line);border-style:dashed}
.opt .why{display:none;grid-column:2;font-size:1.1cqi;font-weight:600}
.ans-on .opt .why{display:block}
.ans-on .opt.ok{border-color:var(--blue);background:var(--blue-soft)}
.ans-on .opt.ok .why{color:var(--blue)}
.ans-on .opt.ok .badge{background:var(--blue)}
.ans-on .opt.no{opacity:.6}
.ans-on .opt.no .why{color:var(--orange)}
.ans-on .opt.no .tx .t0{text-decoration:line-through;text-decoration-color:var(--orange);text-decoration-thickness:.2cqi}
.mqctl{display:flex;gap:.5cqi;flex-wrap:wrap;align-items:center}
.mqbody .subs{overflow:auto;min-height:0;align-self:stretch}

/* ---------- matching (kept) ---------- */
